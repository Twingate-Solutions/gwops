[project]
name = "gwops"
version = "0.1.0"
description = "Control plane for the Twingate Gateway custom container image"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "cryptography==49.0.0",
    "pyyaml==6.0.3",
    "watchfiles==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.15.22",
    "mypy==2.3.0",
    "types-pyyaml==6.0.12.20260518",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["gwops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs external services (e.g. a live Gatorcast); skipped unless opted in",
]
